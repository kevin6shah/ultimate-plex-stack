version: '3.9'

services:
  # WireGuard VPN Container - REQUIRED for secure torrenting
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - 51413:51413  # Transmission torrenting TCP
      - 51413:51413/udp  # Transmission torrenting UDP
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1  # Disable IPv6 to prevent leaks
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped

  # Transmission - Routes ALL traffic through WireGuard
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "service:wireguard"  # THIS IS CRITICAL - shares WireGuard's network
    depends_on:
      - wireguard
    env_file:
      - .friday-ops.env
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
      - UMASK=002
    volumes:
      - ./config/transmission:/config
      - ./share:/share  # Unified volume for hardlinking
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
      - VERSION=docker
      - PLEX_CLAIM=claim-nMSFhYzSR1BxDBzKtBkf
      # Advertise the host IP to ensure clients see the correct LAN address. Replace 192.168.1.42
      # with the IP address of the Mac or host running Docker. Without this, Plex may
      # broadcast the container's bridge IP, causing indirect connections and forcing
      # low-quality transcodes on remote clients like Apple TV.
      - ADVERTISE_IP=http://192.168.1.237:32400/
    ports:
      - 32400:32400
      - 8324:8324
      - 32469:32469
      - 1900:1900/udp
      - 32410-32414:32410-32414/udp
    volumes:
      - ./share/media:/media
      - ./share/downloads:/downloads
      - ./config/plex:/config
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    ports:
      - 8096:8096
      - 7359:7359/udp
    volumes:
      - ./config/jellyfin:/config
      - ./share/media:/media
      - ./share/downloads:/downloads
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    ports:
      - 7878:7878
    volumes:
      - ./config/radarr:/config
      - ./share:/share
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    ports:
      - 8989:8989
    volumes:
      - ./config/sonarr:/config
      - ./share:/share
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:wireguard"  # Shares WireGuard's egress for indexer traffic
    depends_on:
      - wireguard
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
      - HOST=0.0.0.0
      - PORT=8191
    restart: unless-stopped

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    init: true
    environment:
      - HOST=0.0.0.0
      - PORT=8192
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8192/health >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  vpn-web-proxy:
    image: nginx:alpine
    container_name: vpn-web-proxy
    depends_on:
      - wireguard
      - transmission
      - prowlarr
    ports:
      - 9091:9091  # Transmission WebUI via stable bridge proxy
      - 9696:9696  # Prowlarr WebUI via stable bridge proxy
    volumes:
      - ./ops/vpn-web-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9696/ >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    ports:
      - 5055:5055
    volumes:
      - ./config/overseerr:/config
      - ./share:/share
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    ports:
      - 6767:6767
    volumes:
      - ./config/bazarr:/config
      - ./share:/share
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    user: "501:20"
    environment:
      - TZ=America/New_York
    ports:
      - 6246:6246
    volumes:
      - ./config/maintainerr/data:/opt/data
    restart: unless-stopped

  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    user: "501:20"
    environment:
      - TZ=America/New_York
      - UN_START_DELAY=1m
    volumes:
      - ./share:/share
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - 9000:9000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/portainer:/data
    restart: unless-stopped
