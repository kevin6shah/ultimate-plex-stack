AWSTemplateFormatVersion: '2010-09-09'
Description: Friday shared EC2 host for WireGuard VPN and Iris backend.

Parameters:
  InstanceName:
    Type: String
    Default: Friday
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  ImageId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3a.small
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3a.small
      - t3.small
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH to the shared host.
  RootVolumeSizeGiB:
    Type: Number
    Default: 8
  StateTableName:
    Type: String
    Default: friday-agent-state
  ArtifactsBucketName:
    Type: String
    Default: ''
  EnableTemporalIngress:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  TemporalPort:
    Type: Number
    Default: 7233
  TemporalIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the Temporal gRPC endpoint when enabled.

Conditions:
  EnableArtifactsBucketAccess: !Not [!Equals [!Ref ArtifactsBucketName, '']]
  EnableTemporalIngressCondition: !Equals [!Ref EnableTemporalIngress, 'true']

Resources:
  FridaySharedHostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: friday-shared-host-agent-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/friday/agent/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StateTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StateTableName}/index/*'
              - !If
                - EnableArtifactsBucketAccess
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !Sub 'arn:aws:s3:::${ArtifactsBucketName}'
                - !Ref AWS::NoValue
              - !If
                - EnableArtifactsBucketAccess
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource: !Sub 'arn:aws:s3:::${ArtifactsBucketName}/*'
                - !Ref AWS::NoValue

  FridaySharedHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref FridaySharedHostRole

  FridaySharedHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Friday shared host security group
      GroupName: !Sub '${AWS::StackName}-shared-host'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - Description: Iris backend HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: WireGuard UDP
          IpProtocol: udp
          FromPort: 51820
          ToPort: 51820
          CidrIp: 0.0.0.0/0
        - !If
          - EnableTemporalIngressCondition
          - Description: Temporal gRPC
            IpProtocol: tcp
            FromPort: !Ref TemporalPort
            ToPort: !Ref TemporalPort
            CidrIp: !Ref TemporalIngressCidr
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-sg'
        - Key: FridayRole
          Value: shared-host

  FridaySharedHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref FridaySharedHostInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref FridaySharedHostSecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 2
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: FridayRole
          Value: shared-host

Outputs:
  InstanceId:
    Value: !Ref FridaySharedHost
  PublicIp:
    Value: !GetAtt FridaySharedHost.PublicIp
  PublicDnsName:
    Value: !GetAtt FridaySharedHost.PublicDnsName
  SecurityGroupId:
    Value: !Ref FridaySharedHostSecurityGroup
